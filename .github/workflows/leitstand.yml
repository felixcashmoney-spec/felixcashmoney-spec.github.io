# Dashboard (formerly Leitstand of the Strange Knowns automation), https://felixcashmoney-spec.github.io/leitstand/
# Every 5 minutes (Felix 30.10.: live, before every 15): the sealed data of the last night/repair run from the private repo's data branch,
# and the channel's public YouTube numbers (leitstand/update.sh). Commits only when something changed.
#
# GitHub's schedule never fired for this workflow (30.10.: only manual runs), so one run stays up
# for almost 6 hours, updates every 5 minutes and then starts the next run itself (a dispatch with
# the workflow token does start a new run). The schedule stays as a second way in; the concurrency
# group keeps it to one running chain. If the chain ever breaks: Actions -> Dashboard -> Run workflow.
name: Dashboard

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: leitstand
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Update every 5 minutes for 5 h 45 min
        env:
          TOKEN: ${{ secrets.LEITSTAND_READ_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( $(date +%s) + 345 * 60 ))
          while :; do
            # Felix 31.10. (S10): fixes to the sync count from the next round, not only from the next run
            git fetch -q origin main && git checkout -q FETCH_HEAD -- leitstand/live.py leitstand/update.sh || echo "::warning::neuer Code nicht geholt"
            bash leitstand/update.sh || echo "::warning::Abgleich fehlgeschlagen, nächster Versuch in 5 Minuten"
            next=$(( ($(date +%s) / 300 + 1) * 300 + 60 ))       # :01, :06, :11, ...
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) ))
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run leitstand.yml --ref main -R "$GITHUB_REPOSITORY"
