# Leitstand (dashboard of the Strange Knowns automation), https://felixcashmoney-spec.github.io/leitstand/
# Every 15 minutes: the sealed data of the last night/repair run from the private repo's data branch,
# and the channel's public YouTube numbers. Commits only when something changed.
name: Leitstand

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: leitstand
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Data of the night (sealed, the key is only in Felix' link)
        env:
          TOKEN: ${{ secrets.LEITSTAND_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::Secret LEITSTAND_READ_TOKEN fehlt"; exit 0; fi
          url="https://api.github.com/repos/felixcashmoney-spec/Youtube-Automation/contents/leitstand/data.json?ref=claude/ytauto-data"
          if ! curl -sSf -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" "$url" -o "$RUNNER_TEMP/data.json"; then
            echo "::warning::data.json nicht geholt"; exit 0
          fi
          python3 -c "import json,sys; b=json.load(open(sys.argv[1])); assert b['v'] == 1 and b['iv'] and b['ct']" "$RUNNER_TEMP/data.json"
          cp "$RUNNER_TEMP/data.json" leitstand/data.json

      - name: YouTube numbers (public, live)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "::warning::Secret YOUTUBE_API_KEY fehlt"; exit 0; fi
          python3 leitstand/live.py leitstand/live.json || echo "::warning::YouTube-Zahlen nicht geholt"

      - name: Commit and build the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add leitstand/data.json leitstand/live.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="leitstand-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Leitstand $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
          # pushes with the workflow token may not start a Pages build by themselves
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" -o /dev/null -w "Pages build: %{http_code}\n" || true
